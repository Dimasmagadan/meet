name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + build + test (Node)
    # macOS runner, not ubuntu: the product is macOS-only and the suite is not
    # platform-independent (ps/comm identity, sysctl/vm_stat probes, recorder
    # shutdown race — specs/CI_LINUX_FINDINGS_2026-10-31.md). On ubuntu the
    # 2026-10-31 v1.2.0 run hung forever on a leaked recorder.test.js process.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      # Tests run against compiled dist/ with temp-dir I/O and fake
      # executables; some probes shell out to darwin tools (see job comment).
      - name: Run tests
        run: npm test

  swift:
    name: Build Swift targets (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build AudioCapture + AudioAnalysis
        working-directory: native/AudioCapture
        run: swift build

      - name: Build MeetMenuBar
        working-directory: native/MenuBar
        run: swift build

      # MenuBar --self-test-* asserts (notch, calendar, recording-state,
      # writer budget) run in CI, not only locally (SPEC_SAFETY_NET_2026-10-31 §2.5.4).
      - name: Swift self-tests
        run: npm run test:swift
