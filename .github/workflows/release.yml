name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    # Same runner as CI's test job (macos-latest) — the suite is darwin-bound
    # (specs/CI_LINUX_FINDINGS_2026-10-31.md); on ubuntu it hangs instead of failing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Release gate (SPEC_SAFETY_NET_2026-10-31 §2.5.1): the suite must pass
      # before a release is cut. Runs on the product's platform (see CI).
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs "$TAG"

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$TAG" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
